<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Merry Christmas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #08020a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
    touch-action: none;
    user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .title {
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; pointer-events: none; z-index: 10;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(26px, 6.5vw, 40px); font-weight: bold;
    letter-spacing: 1px;
    transition: color 0.8s ease;
  }
  .controls {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    width: min(94vw, 520px); z-index: 20;
  }
  button {
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(15, 10, 22, 0.65);
    color: #fff; padding: 9px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  button:active { transform: scale(0.94); }
  button.gift-btn {
    background: linear-gradient(135deg, #ff2e93, #ff75b5);
    border-color: rgba(255,255,255,0.55);
    box-shadow: 0 0 18px rgba(255, 46, 147, 0.6);
  }
</style>
</head>
<body>
  <div class="title" id="titleText">Merry Christmas</div>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <button class="gift-btn" id="giftBtn">🎁 Gift</button>
    <button id="themeBtn">Theme: Rose Magic</button>
    <button id="glowBtn">Glow: ON</button>
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const titleEl = document.getElementById("titleText");
  const themeBtn = document.getElementById("themeBtn");
  const glowBtn = document.getElementById("glowBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const resetBtn = document.getElementById("resetBtn");
  const giftBtn = document.getElementById("giftBtn");

  const THEMES = [
    { name: "Rose Magic", colors: [[255,105,180],[255,20,147],[255,182,193],[255,105,180],[255,255,255],[219,112,147]], bg: [8,2,10] },
    { name: "Royal Purple", colors: [[168,85,247],[147,51,234],[192,132,252],[216,180,254],[255,255,255],[139,92,246]], bg: [6,2,14] },
    { name: "Golden Christmas", colors: [[255,215,0],[255,223,0],[255,180,0],[255,240,180],[255,255,255],[255,165,0]], bg: [10,6,0] },
    { name: "Frozen Christmas", colors: [[0,191,255],[135,206,250],[173,216,230],[0,255,255],[255,255,255],[100,180,255]], bg: [2,6,14] },
    { name: "Divine Aurora", colors: [[16,185,129],[45,212,191],[52,211,153],[167,139,250],[255,255,255],[0,255,180]], bg: [2,10,8] }
  ];

  // Pre-rendered soft-glow particle sprites for crisp, magical stardust
  let sprites = [];
  let whiteSprite = null;

  function makeGlowSprite(c) {
    const s = document.createElement("canvas");
    s.width = 32; s.height = 32;
    const gctx = s.getContext("2d");
    const grad = gctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, "rgba(255,255,255,1)");
    grad.addColorStop(0.22, `rgba(${c[0]},${c[1]},${c[2]},0.92)`);
    grad.addColorStop(0.55, `rgba(${c[0]},${c[1]},${c[2]},0.28)`);
    grad.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
    gctx.fillStyle = grad;
    gctx.fillRect(0, 0, 32, 32);
    return s;
  }

  function rebuildSprites(idx) {
    sprites = THEMES[idx].colors.map(makeGlowSprite);
    if (!whiteSprite) whiteSprite = makeGlowSprite([255, 255, 255]);
  }

  let W = window.innerWidth, H = window.innerHeight, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  let themeIdx = 0;
  let glowOn = true;
  let paused = false;
  let angle = 0;
  let camDist = 3.1;
  let targetDist = 3.1;
  const autoSpeed = 0.11; // Slow, graceful spin
  let timeT = 0;

  // Theme transition state
  let transPhase = "idle";
  let transProg = 0;
  let pendingThemeIdx = 0;
  const sparkTrail = [];

  // Gift surprise state
  const gift = {
    phase: "idle",
    timer: 0,
    messageAlpha: 0,
    shockwaves: [],
    miniHearts: []
  };

  const N_TREE = 3200;
  const N_TRAIL = 320;
  const N_AMBIENT = 220;

  function randGauss() {
    return (Math.random() + Math.random() + Math.random() - 1.5) * 0.65;
  }

  const treePts = [];
  for (let i = 0; i < N_TREE; i++) {
    const yNorm = Math.pow(Math.random(), 0.85);
    const y = -1.0 + yNorm * 2.2;
    const maxR = (1.0 - yNorm) * 0.95 + 0.02;
    let x, z;
    if (Math.random() < 0.65) {
      const a = yNorm * 7.5 * Math.PI * 2 + randGauss() * 0.18;
      const r = maxR * (0.85 + Math.random() * 0.15);
      x = Math.cos(a) * r; z = Math.sin(a) * r;
    } else {
      const a = Math.random() * Math.PI * 2;
      const r = maxR * Math.sqrt(Math.random()) * 0.9;
      x = Math.cos(a) * r; z = Math.sin(a) * r;
    }
    x += randGauss() * 0.015; z += randGauss() * 0.015;
    const sa = Math.random() * Math.PI * 2;
    const sr = 1.1 + Math.random() * 1.4;
    treePts.push({
      hx: x, hy: y, hz: z,
      sx: x + Math.cos(sa) * sr, sy: y + (Math.random() - 0.5) * 1.2, sz: z + Math.sin(sa) * sr,
      hNorm: yNorm,
      cIdx: Math.floor(Math.random() * 6),
      size: 0.45 + Math.random() * 0.95, // Fine, delicate stardust
      phase: Math.random() * Math.PI * 2
    });
  }

  const trailPts = [];
  for (let i = 0; i < N_TRAIL; i++) {
    const yNorm = Math.random();
    const y = -1.0 + yNorm * 2.2;
    const r = ((1 - yNorm) * 0.95 + 0.05) * 1.12;
    trailPts.push({
      r, y, a: Math.random() * Math.PI * 2,
      speed: 0.12 + Math.random() * 0.22,
      cIdx: i % 6
    });
  }

  const ambient = [];
  for (let i = 0; i < N_AMBIENT; i++) {
    ambient.push({
      x: (Math.random() - 0.5) * 4.4,
      y: (Math.random() - 0.5) * 3.4,
      z: (Math.random() - 0.5) * 3.0,
      phase: Math.random() * Math.PI * 2,
      cIdx: i % 6
    });
  }

  const bursts = [];

  function rgb(c, a = 1) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

  function updateThemeUI() {
    rebuildSprites(themeIdx);
    const c = THEMES[themeIdx].colors[0];
    titleEl.style.color = `rgb(${c[0]},${c[1]},${c[2]})`;
    titleEl.style.textShadow = `0 0 18px rgba(${c[0]},${c[1]},${c[2]},0.75)`;
    themeBtn.textContent = `Theme: ${THEMES[themeIdx].name}`;
  }
  updateThemeUI();

  function project(x, y, z, ang, dist) {
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const rx = x * ca + z * sa;
    const rz = -x * sa + z * ca;
    // Responsive scale so the tree fills portrait mobile screens nicely
    const baseScale = Math.min(W * 0.72, H * 0.56);
    const scale = baseScale / (dist - rz * 0.45 + 0.75);
    return {
      sx: W / 2 + rx * scale,
      sy: H * 0.52 - y * scale,
      scale, depth: (rz + 1) / 2
    };
  }

  function drawHeartShape(cx, cy, s, color, alpha, rot = 0) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    if (glowOn) {
      ctx.shadowColor = rgb(color, 0.95);
      ctx.shadowBlur = s * 1.4;
    }
    ctx.beginPath();
    for (let i = 0; i <= 32; i++) {
      const t = (i / 32) * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const px = (hx * s) / 16, py = -(hy * s) / 16;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = rgb(color, 1);
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.stroke();
    ctx.restore();
  }

  function triggerThemeChange() {
    pendingThemeIdx = (themeIdx + 1) % THEMES.length;
    transPhase = "dissolving";
    transProg = 0;
    sparkTrail.length = 0;
  }

  function triggerGift() {
    gift.phase = "beating";
    gift.timer = 0;
    gift.messageAlpha = 0;
    gift.shockwaves.length = 0;
    gift.miniHearts.length = 0;
  }

  themeBtn.addEventListener("click", triggerThemeChange);
  giftBtn.addEventListener("click", triggerGift);
  glowBtn.addEventListener("click", () => {
    glowOn = !glowOn;
    glowBtn.textContent = `Glow: ${glowOn ? "ON" : "OFF"}`;
  });
  pauseBtn.addEventListener("click", () => {
    paused = !paused;
    pauseBtn.textContent = paused ? "Resume" : "Pause";
  });
  resetBtn.addEventListener("click", () => {
    angle = 0; targetDist = 3.1; camDist = 3.1;
  });

  // Mouse & Touch Controls
  let dragging = false, lastX = 0, pinchStartDist = 0, pinchStartCam = 3.1, moved = false;

  canvas.addEventListener("pointerdown", e => {
    dragging = true; lastX = e.clientX; moved = false;
  });
  window.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - lastX; lastX = e.clientX;
    if (Math.abs(dx) > 2) moved = true;
    angle += dx * 0.008;
  });
  window.addEventListener("pointerup", e => {
    if (dragging && !moved && e.target === canvas) {
      bursts.push({ x: e.clientX, y: e.clientY, life: 1.0 });
    }
    dragging = false;
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    targetDist = Math.max(1.8, Math.min(5.2, targetDist + e.deltaY * 0.002));
  }, { passive: false });

  canvas.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
      dragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.hypot(dx, dy);
      pinchStartCam = targetDist;
    }
  }, { passive: true });
  canvas.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && pinchStartDist > 0) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      targetDist = Math.max(1.8, Math.min(5.2, pinchStartCam * (pinchStartDist / d)));
    }
  }, { passive: true });

  let lastTime = performance.now();

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    if (!paused) {
      timeT += dt;
      angle += autoSpeed * dt;
    }
    camDist += (targetDist - camDist) * 0.08;

    // Theme transition update
    if (transPhase === "dissolving") {
      transProg += dt / 0.9;
      if (transProg >= 1) {
        themeIdx = pendingThemeIdx;
        updateThemeUI();
        transPhase = "reforming";
        transProg = 0;
        sparkTrail.length = 0;
      }
    } else if (transPhase === "reforming") {
      transProg += dt / 2.8;
      const h = Math.min(1, transProg);
      const spY = -1.0 + h * 2.38;
      const spR = Math.max(0.02, (1 - h) * 1.02);
      const spAng = h * Math.PI * 2 * 3.5;
      sparkTrail.push({ x: Math.cos(spAng) * spR, y: spY, z: Math.sin(spAng) * spR, life: 1.0 });
      if (sparkTrail.length > 85) sparkTrail.shift();
      for (const s of sparkTrail) s.life -= dt * 1.1;

      if (transProg >= 1) {
        transPhase = "idle";
        transProg = 0;
        const topP = project(0, 1.38, 0, angle, camDist);
        bursts.push({ x: topP.sx, y: topP.sy, life: 1.0 });
      }
    }

    const theme = THEMES[themeIdx];
    const bg = theme.bg;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgb(${bg[0]},${bg[1]},${bg[2]})`;
    ctx.fillRect(0, 0, W, H);

    // Ambient bokeh stars
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < N_AMBIENT; i++) {
      const a = ambient[i];
      const p = project(a.x, a.y, a.z, angle * 0.3, camDist + 0.8);
      if (p.sx < -10 || p.sx > W + 10 || p.sy < -10 || p.sy > H + 10) continue;
      const tw = 0.35 + 0.65 * Math.sin(timeT * 1.8 + a.phase);
      const sz = 4 + tw * 5;
      ctx.globalAlpha = tw * 0.55;
      ctx.drawImage(sprites[a.cIdx], p.sx - sz / 2, p.sy - sz / 2, sz, sz);
    }

    // Glowing elliptical base
    const baseP = project(0, -1.05, 0, angle, camDist);
    const baseAlpha = transPhase === "dissolving" ? Math.max(0, 1 - transProg) : transPhase === "reforming" ? Math.min(1, transProg * 2) : 1;
    if (baseAlpha > 0.02) {
      ctx.globalAlpha = 1;
      const baseR = Math.min(W * 0.42, 180);
      const grad = ctx.createRadialGradient(baseP.sx, baseP.sy, 6, baseP.sx, baseP.sy, baseR);
      grad.addColorStop(0, rgb(theme.colors[0], 0.45 * baseAlpha));
      grad.addColorStop(1, rgb(theme.colors[0], 0));
      ctx.save();
      ctx.scale(1, 0.22);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(baseP.sx, baseP.sy / 0.22, baseR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Tree particles (crisp glowing stardust)
    ctx.globalCompositeOperation = glowOn ? "lighter" : "source-over";
    const sizeScale = Math.min(W, H) / 420;
    for (let i = 0; i < N_TREE; i++) {
      const pt = treePts[i];
      let px = pt.hx, py = pt.hy, pz = pt.hz;
      let alpha = 1, flash = 0;

      if (transPhase === "dissolving") {
        const t = transProg * transProg;
        px = pt.hx + (pt.sx - pt.hx) * t;
        py = pt.hy + (pt.sy - pt.hy) * t;
        pz = pt.hz + (pt.sz - pt.hz) * t;
        alpha = Math.max(0, 1 - transProg * 1.15);
      } else if (transPhase === "reforming") {
        const local = (transProg - pt.hNorm * 0.85) / 0.25;
        if (local <= 0) continue;
        const ease = 1 - Math.pow(1 - Math.min(1, local), 3);
        const swirl = (1 - ease) * Math.PI * 1.2;
        const cs = Math.cos(swirl), ss = Math.sin(swirl);
        const bx = pt.hx + (pt.sx - pt.hx) * (1 - ease) * 0.65;
        const bz = pt.hz + (pt.sz - pt.hz) * (1 - ease) * 0.65;
        px = bx * cs - bz * ss;
        pz = bx * ss + bz * cs;
        py = pt.hy - (1 - ease) * 0.25;
        alpha = ease;
        flash = Math.max(0, 1 - local * 2.2);
      }

      if (alpha <= 0.02) continue;
      const p = project(px, py, pz, angle, camDist);
      if (p.sx < -12 || p.sx > W + 12 || p.sy < -12 || p.sy > H + 12) continue;

      const tw = 0.55 + 0.45 * Math.sin(timeT * 2.8 + pt.phase);
      const spriteSize = (glowOn ? 7.5 : 4.2) * pt.size * sizeScale * (0.55 + p.depth * 0.7) * (3.1 / Math.max(1.5, camDist));
      ctx.globalAlpha = Math.min(1, alpha * (0.45 + tw * 0.55));
      const sp = flash > 0.2 ? whiteSprite : sprites[pt.cIdx];
      ctx.drawImage(sp, p.sx - spriteSize / 2, p.sy - spriteSize / 2, spriteSize, spriteSize);
    }

    // Orbiting trails
    if (transPhase === "idle") {
      for (let i = 0; i < N_TRAIL; i++) {
        const tr = trailPts[i];
        const a0 = tr.a + timeT * tr.speed;
        const y = tr.y + Math.sin(timeT * 1.2 + i) * 0.02;
        const p = project(Math.cos(a0) * tr.r, y, Math.sin(a0) * tr.r, 0, camDist);
        const sz = 6.5 * sizeScale;
        ctx.globalAlpha = 0.72;
        ctx.drawImage(sprites[tr.cIdx], p.sx - sz / 2, p.sy - sz / 2, sz, sz);
      }
    }

    // Spinning sparkline during reform
    if (transPhase === "reforming" && sparkTrail.length > 1) {
      for (let i = 0; i < sparkTrail.length; i++) {
        const s = sparkTrail[i];
        if (s.life <= 0) continue;
        const p = project(s.x, s.y, s.z, angle, camDist);
        const isHead = i === sparkTrail.length - 1;
        const sz = isHead ? 26 * sizeScale : (5 + (i / sparkTrail.length) * 11) * sizeScale;
        ctx.globalAlpha = isHead ? 1 : Math.max(0, s.life * 0.9);
        ctx.drawImage(isHead ? whiteSprite : sprites[0], p.sx - sz / 2, p.sy - sz / 2, sz, sz);
      }
    }

    // Tap bursts
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.life -= dt * 0.9;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      for (let k = 0; k < 14; k++) {
        const a = (k / 14) * Math.PI * 2 + timeT;
        const rr = (1 - b.life) * 65;
        const sz = 10 * b.life;
        ctx.globalAlpha = b.life;
        ctx.drawImage(sprites[k % 6], b.x + Math.cos(a) * rr - sz / 2, b.y + Math.sin(a) * rr - sz / 2, sz, sz);
      }
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    // Heart Topper + Gift Surprise
    const topP = project(0, 1.34 + Math.sin(timeT * 2) * 0.025, 0, angle, camDist);
    let heartScale = Math.max(14, 18 * sizeScale) * (1 + 0.1 * Math.sin(timeT * 3.5));
    let heartAlpha = transPhase === "dissolving" ? Math.max(0, 1 - transProg * 1.5) : transPhase === "reforming" ? Math.max(0, (transProg - 0.85) / 0.15) : 1;

    if (gift.phase === "beating") {
      gift.timer += dt;
      const beat = Math.pow(Math.max(0, Math.sin(gift.timer * Math.PI * 4)), 2);
      heartScale *= (1 + beat * (0.6 + gift.timer * 0.5));
      if (gift.timer >= 1.5) {
        gift.phase = "blasted";
        gift.timer = 0;
        gift.shockwaves.push({ x: topP.sx, y: topP.sy, r: 10, maxR: Math.min(W, H) * 0.5, alpha: 1 });
        for (let i = 0; i < 75; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 85 + Math.random() * 240;
          gift.miniHearts.push({
            x: topP.sx, y: topP.sy,
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 40,
            size: 6 + Math.random() * 10,
            rot: (Math.random() - 0.5) * 0.6,
            vRot: (Math.random() - 0.5) * 1.5,
            life: 5.5 + Math.random() * 2.0,
            wobble: Math.random() * Math.PI * 2,
            color: i % 3 === 0 ? [255, 80, 150] : i % 3 === 1 ? [255, 180, 210] : theme.colors[0]
          });
        }
      }
    } else if (gift.phase === "blasted") {
      gift.timer += dt;
      heartAlpha = gift.timer < 1.8 ? 0 : Math.min(1, (gift.timer - 1.8) / 1.0);
      if (gift.timer < 5.5) {
        gift.messageAlpha = Math.min(1, gift.messageAlpha + dt * 1.6);
      } else {
        gift.messageAlpha = Math.max(0, gift.messageAlpha - dt * 0.7);
      }
      if (gift.timer > 7.8 && gift.miniHearts.length === 0) gift.phase = "idle";
    }

    if (heartAlpha > 0.02) {
      drawHeartShape(topP.sx, topP.sy, heartScale, theme.colors[0], heartAlpha);
    }

    // Gift shockwaves
    for (let i = gift.shockwaves.length - 1; i >= 0; i--) {
      const sw = gift.shockwaves[i];
      sw.r += (sw.maxR - sw.r) * dt * 4.5;
      sw.alpha -= dt * 1.1;
      if (sw.alpha <= 0) { gift.shockwaves.splice(i, 1); continue; }
      ctx.save();
      ctx.strokeStyle = rgb(theme.colors[0], sw.alpha);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Gift mini hearts
    for (let i = gift.miniHearts.length - 1; i >= 0; i--) {
      const h = gift.miniHearts[i];
      h.life -= dt;
      if (h.life <= 0) { gift.miniHearts.splice(i, 1); continue; }
      h.vx *= 0.965;
      h.vy = h.vy * 0.965 - 12 * dt;
      h.x += (h.vx + Math.sin(timeT * 2.5 + h.wobble) * 18) * dt;
      h.y += h.vy * dt;
      h.rot += h.vRot * dt;
      drawHeartShape(h.x, h.y, h.size, h.color, Math.min(1, h.life / 1.5), h.rot);
    }

    // Gift message
    if (gift.messageAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = gift.messageAlpha;
